<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events & Engagements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3864; --navy-2:#2a4a80; --primary:#2f5bd3; --primary-50:#eef3ff; --primary-100:#dbe5ff;
  --accent:#f59e0b; --bg:#f4f6fb; --surface:#fff; --text:#1b2333; --muted:#667085; --border:#e4e8f0;
  --green:#15803d; --green-50:#e8f7ee; --red:#c62828; --red-50:#fdecec; --amber:#b45309; --amber-50:#fff5e1;
  --violet:#6d28d9; --violet-50:#f1ebff; --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--primary);text-decoration:none;cursor:pointer}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600} h4{font-size:13px;font-weight:600}
p{margin:0}
.svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cfd8ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#f97316);display:grid;place-items:center;font-weight:700;color:#fff}
.brand small{display:block;color:#9fb0d1;font-size:11px;font-weight:500}
.side .sect{padding:10px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8193b8}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;margin:1px 10px;border-radius:8px;color:#cfd8ea;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.13);color:#fff}
.nav a .cnt{margin-left:auto;background:var(--accent);color:#1b2333;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side-foot label{display:flex;align-items:center;gap:8px;cursor:pointer}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20}
.top .crumb{color:var(--muted);font-size:13px}
.top .crumb b{color:var(--text);font-weight:600}
.top .sp{flex:1}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.rolesel{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:4px 6px 4px 4px;background:var(--surface)}
.rolesel .av{width:30px;height:30px;border-radius:8px;background:var(--primary-100);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px}
.rolesel select{border:0;background:transparent;font-weight:600;outline:none;max-width:190px}
.menu-btn{display:none}
.content{padding:24px;max-width:1320px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}

/* Components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px} .pad-l{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:9px 14px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn-p{background:var(--primary);color:#fff} .btn-p:hover{background:#244bb8}
.btn-o{background:var(--surface);color:var(--text);border-color:var(--border)} .btn-o:hover{background:#f8f9fc}
.btn-g{background:transparent;color:var(--primary);padding:6px 8px}
.btn-d{background:var(--red);color:#fff}
.btn-s{background:var(--green);color:#fff}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-lg{padding:12px 18px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.w100{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:#eef1f6;color:#3b4456;white-space:nowrap}
.pill.blue{background:var(--primary-50);color:var(--primary)} .pill.green{background:var(--green-50);color:var(--green)}
.pill.red{background:var(--red-50);color:var(--red)} .pill.amber{background:var(--amber-50);color:var(--amber)}
.pill.violet{background:var(--violet-50);color:var(--violet)} .pill.dark{background:var(--navy);color:#fff}
.pill.accent{background:#fff1d6;color:#92400e}
.scope{display:none;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:#fde68a;color:#78350f;vertical-align:middle;margin-left:6px}
body.show-scope .scope{display:inline-block}
.row{display:flex;gap:12px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:600}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.divider{height:1px;background:var(--border);margin:16px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:#344054}
.inp{border:1px solid var(--border);border-radius:9px;padding:9px 12px;background:#fff;outline:none;width:100%}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
textarea.inp{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--primary)}
.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#cdd3df;border-radius:22px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--primary)} .toggle input:checked+span:before{transform:translateX(16px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
.seg{display:inline-flex;background:#eef1f6;border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;background:#f8f9fc;border-bottom:1px solid var(--border);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.kpi{padding:16px 18px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)}
.bar{height:8px;background:#eef1f6;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:8px}
.bar.warn i{background:var(--accent)} .bar.full i{background:var(--red)} .bar.ok i{background:var(--green)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid}
.alert.info{background:var(--primary-50);border-color:var(--primary-100);color:#1e3a8a}
.alert.warn{background:var(--amber-50);border-color:#fcd9a0;color:#7c2d12}
.alert.err{background:var(--red-50);border-color:#f6c2c2;color:#7f1d1d}
.alert.ok{background:var(--green-50);border-color:#b9e6c9;color:#14532d}
.empty{padding:36px;text-align:center;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* Event cards */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ev{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:.15s}
.ev:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.1)}
.ev-ban{height:118px;position:relative;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.ev-ban .flags{display:flex;gap:6px;flex-wrap:wrap}
.ev-ban .flags .pill{background:rgba(255,255,255,.92)}
.ev-ban .big{font-size:12px;font-weight:600;opacity:.95;display:flex;gap:8px;align-items:center}
.ev-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.ev-body h3{font-size:15.5px}
.meta{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#475467}
.meta div{display:flex;gap:8px;align-items:flex-start}
.meta .svg{margin-top:2px;color:var(--muted);width:14px;height:14px}
.ev-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px dashed var(--border)}
.price{font-weight:700;font-size:16px}
.th-Sports{background:linear-gradient(135deg,#0f766e,#14b8a6)} .th-Psychology{background:linear-gradient(135deg,#6d28d9,#a78bfa)}
.th-Cultural{background:linear-gradient(135deg,#c2410c,#fb923c)} .th-STEM{background:linear-gradient(135deg,#1d4ed8,#60a5fa)}
.th-Nutrition{background:linear-gradient(135deg,#4d7c0f,#a3e635)} .th-Wellness{background:linear-gradient(135deg,#0e7490,#67e8f9)}
.th-PerformingArts{background:linear-gradient(135deg,#be185d,#f472b6)}

/* Filters */
.disc{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.filters{position:sticky;top:80px}
.filters .fg{padding:14px 16px;border-bottom:1px solid var(--border)}
.filters .fg:last-child{border-bottom:0}
.filters h4{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:500;color:#344054}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.searchbar{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:#fff;flex:1;min-width:220px}
.searchbar input{border:0;outline:none;padding:10px 0;width:100%;background:transparent}

/* Detail */
.hero{border-radius:16px;padding:26px;color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:26px;margin:10px 0 8px}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.detail{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px;align-items:start}
.sticky{position:sticky;top:80px}
.sec{margin-bottom:18px}
.sec h2{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.agenda-item{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.agenda-item:last-child{border:0}
.mapbox{height:170px;border-radius:10px;background:repeating-linear-gradient(45deg,#e8eef8,#e8eef8 10px,#f1f5fb 10px,#f1f5fb 20px);display:grid;place-items:center;color:var(--muted);position:relative}
.mapbox .pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);display:grid;place-items:center}
.faq{border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.faq summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"+";color:var(--muted)} .faq[open] summary::after{content:"–"}
.faq p{padding:0 14px 12px;color:#475467}

/* Stepper */
.stepper{display:flex;gap:0;margin-bottom:22px;overflow-x:auto;padding-bottom:4px}
.step{display:flex;align-items:center;gap:8px;flex:1;min-width:120px;font-size:13px;font-weight:600;color:var(--muted)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e9edf4;color:var(--muted);font-size:12px;flex:none}
.step.on{color:var(--text)} .step.on .n{background:var(--primary);color:#fff}
.step.done .n{background:var(--green);color:#fff}
.step:not(:last-child)::after{content:"";flex:1;height:2px;background:#e3e7ef;margin:0 8px;min-width:12px}
.step.done:not(:last-child)::after{background:var(--green)}
.vsteps{display:flex;flex-direction:column;gap:2px}
.vsteps button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--muted)}
.vsteps button.on{background:var(--primary-50);color:var(--primary)}
.vsteps button .n{width:22px;height:22px;border-radius:50%;background:#e9edf4;display:grid;place-items:center;font-size:11px;flex:none}
.vsteps button.on .n{background:var(--primary);color:#fff}
.vsteps button.done .n{background:var(--green);color:#fff}
.status-track{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-track .s{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.status-track .s i{width:10px;height:10px;border-radius:50%;background:#d0d5dd}
.status-track .s.on{color:var(--text)} .status-track .s.on i{background:var(--green)}
.status-track .s.cur i{background:var(--accent);box-shadow:0 0 0 4px #fde9c4}
.status-track .ln{width:24px;height:2px;background:#d0d5dd}

.pcard{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.pcard.sel{border-color:var(--primary);background:#fafbff;box-shadow:0 0 0 3px var(--primary-50)}
.pcard.bad{background:#fffafa}
.issue{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-top:6px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.qty button{border:0;background:#f8f9fc;width:32px;height:32px;font-size:16px}
.qty span{width:36px;text-align:center;font-weight:600}
.paym{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paym button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.paym button.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.sumline{display:flex;justify-content:space-between;padding:6px 0}
.pass{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#fff;max-width:360px}
.pass-top{background:var(--navy);color:#fff;padding:16px 18px}
.pass-mid{padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;border-bottom:2px dashed var(--border)}
.pass-bot{padding:14px 18px;font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pass-bot b{display:block;font-size:13px}

/* Modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* Check-in */
.scanner{aspect-ratio:1;max-width:340px;border-radius:18px;background:#0b1220;position:relative;overflow:hidden;margin:0 auto;display:grid;place-items:center}
.scanner .frame{width:62%;aspect-ratio:1;border:3px solid rgba(255,255,255,.85);border-radius:14px;position:relative}
.scanner .laser{position:absolute;left:8%;right:8%;height:2px;background:#22c55e;box-shadow:0 0 12px #22c55e;animation:scan 2s infinite ease-in-out}
@keyframes scan{0%,100%{top:10%}50%{top:88%}}
.feed div{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;background:var(--primary);border-radius:6px 6px 0 0}
.bars .b span{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bars .b em{font-style:normal;font-size:11px;font-weight:600}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;padding:6px 0;font-size:13px}

/* Guide */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow a{background:var(--primary-50);color:var(--primary);padding:6px 10px;border-radius:8px;font-weight:600;font-size:12.5px}
.flow .arr{color:var(--muted)}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-l{background:linear-gradient(150deg,var(--navy),#2f5bd3);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-r{display:grid;place-items:center;padding:32px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolegrid button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px;text-align:left;font-weight:600;font-size:13px}
.rolegrid button.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.rolegrid small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}

@media (max-width:1100px){.detail{grid-template-columns:1fr}.sticky{position:static}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .disc{grid-template-columns:1fr}.filters{position:static}
  .g3,.g2{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}.login-l{display:none}
  .top .crumb{display:none}
}
@media (max-width:600px){
  .content{padding:16px}.top{padding:0 16px}
  .g4{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
  .paym{grid-template-columns:1fr}
  .rolesel select{max-width:120px}
  .agenda-item{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 44px}
}
</style>

const OPTS={cat:['Competition','Showcase','Seminar','Webinar','Festival','Open House','Community Service','Fundraiser','Engagement Activity'],theme:['Sports','Performing Arts','Wellness','Psychology','Nutrition','STEM','Cultural'],mode:['Online','Offline','Hybrid'],aud:['Students','Parents','Coaches','Public']};
function visibleEvents(){
 const f=S.f;let list=EVENTS.filter(e=>e.status==='Published');
 // role-based visibility
 if(S.role==='student')list=list.filter(e=>e.aud.includes('Students')&&(!e.grades||(6>=e.grades[0]&&6<=e.grades[1])));
 if(S.role==='partner')list=list.filter(e=>e.vis==='Public');
 if(S.role!=='parent'&&S.role!=='admin')list=list.filter(e=>e.vis!=='Parents-only'||S.role==='coach'&&false);
 if(f.q){const q=f.q.toLowerCase();list=list.filter(e=>(e.title+e.cat+e.theme+e.venue+e.hosts.map(h=>h[0]).join()).toLowerCase().includes(q))}
 ['cat','theme','mode'].forEach(k=>{if(f[k].length)list=list.filter(e=>f[k].includes(e[k]))});
 if(f.aud.length)list=list.filter(e=>e.aud.some(a=>f.aud.includes(a)));
 if(f.grade)list=list.filter(e=>e.grades&&+f.grade>=e.grades[0]&&+f.grade<=e.grades[1]);
 if(f.city)list=list.filter(e=>e.city===f.city);
 if(f.price)list=list.filter(e=>f.price==='Free'?e.fee===0:e.fee>0);
 if(f.avail)list=list.filter(e=>f.avail==='Open'?e.left>0:e.left===0);
 if(f.quick)list=list.filter(e=>e.flags.includes(f.quick));
 if(f.from)list=list.filter(e=>e.d>=f.from); if(f.to)list=list.filter(e=>e.d<=f.to);
 if(S.sort==='date')list.sort((a,b)=>a.d.localeCompare(b.d));
 if(S.sort==='popular')list.sort((a,b)=>b.interest-a.interest);
 if(S.sort==='price')list.sort((a,b)=>a.fee-b.fee);
 return list;
}

 if(e.aud.includes('Parents')||e.aud.includes('Public'))t.push({k:'parent',n:e.aud.includes('Students')?'Parent / extra pass':'Parent pass',p:e.aud.includes('Students')?Math.round(e.fee*.4):e.fee,cap:2,desc:e.aud.includes('Students')?'Spectator entry':'Attendee entry'});
 if(e.id===3)t.push({k:'work',n:'Workshop add-on',p:350,cap:2,desc:'Day 3 art workshop',partial:true});return t}
function calc(){const r=S.reg,e=ev(r.ev);let sub=0;ticketTypes(e).forEach(t=>sub+=(r.tix[t.k]||0)*t.p);let disc=0;
 if(r.promoOk==='EARLY10')disc=Math.round(sub*.1);if(r.promoOk==='REF100')disc=Math.min(100,sub);if(r.promoOk==='SIB15')disc=Math.round(sub*.15);
 const total=sub-disc;return {sub,disc,total,now:r.plan==='part'?Math.round(total*.4):total}}

 const status=`<div class="status-track"><span class="s ${r.step<4?'cur':'on'}"><i></i>Draft${P()}</span><span class="ln"></span><span class="s ${r.step===4?'cur':''}"><i></i>Submitted (Pending Payment)</span><span class="ln"></span><span class="s"><i></i>Confirmed</span></div>`;
 let body='';const c=calc();
 if(r.step===0){

  body=`<h2>Who is attending?</h2><p class="muted mt8 mb16">Each participant is checked for age/grade, audience, capacity and required documents.</p>

  <div class="col">${people().map(p=>{const is=elig(e,p.adult?'self':p);const sel=r.sel.includes(p.id);const blocked=is.some(i=>i.t!=='doc');
   return `<label class="pcard ${sel?'sel':''} ${blocked?'bad':''}" style="cursor:${blocked?'not-allowed':'pointer'}">
    <input type="checkbox" style="margin-top:8px;width:18px;height:18px;accent-color:var(--primary)" ${sel?'checked':''} ${blocked?'disabled':''} onchange="selP('${p.id}')">
    <div class="avatar" style="background:${p.adult?'var(--amber-50)':'var(--primary-50)'};color:${p.adult?'var(--amber)':'var(--primary)'}">${p.ini}</div>
    <div style="flex:1"><div class="row between wrap"><b>${p.name}${p.adult?' (You)':''}</b>${blocked?pill(ic('x',11)+' Not eligible','red'):is.length?pill(ic('alert',11)+' Action required','amber'):pill(ic('check',11)+' Eligible','green')}</div>
    <div class="small muted">${p.adult?'Parent / guardian':`Grade ${p.grade} · Age ${p.age} · ${p.adm}`}</div>
    ${is.map(i=>`<div class="issue" style="color:${i.t==='doc'?'var(--amber)':'var(--red)'}">${ic('alert',13)}${i.m}${i.act?`<button class="btn btn-o btn-sm" onclick="event.preventDefault();uploadDoc()">${ic('upload',13)}Upload now</button>`:''}</div>`).join('')}
    ${!is.length?`<div class="issue" style="color:var(--green)">${ic('check',13)}${p.adult?'Audience check passed':'Age/grade, audience &amp; consent checks passed'} · ${full?'Waitlist available':'Seat available'}</div>`:''}
    </div></label>`}).join('')}</div>
  ${people().some(p=>elig(e,p.adult?'self':p).some(i=>i.t==='doc'))?`<div class="alert warn mt16">${ic('file')}<div><b>Required actions</b><div class="small">Upload the missing document to continue, or save this registration as a draft and come back later.${P()}</div></div></div>`:''}`;
 }
 if(r.step===1){
  body=`<h2>Choose tickets / passes${P()}</h2><p class="muted mt8 mb16">Family cap: max 4 passes per event. ${r.sel.length} participant(s) selected.</p>
  <div class="col">${ticketTypes(e).map(t=>`<div class="pcard" style="align-items:center"><div style="flex:1"><b>${t.n}</b>${t.partial?P():''}<div class="small muted">${t.desc} · max ${t.cap} per family</div></div><div class="price" style="min-width:80px;text-align:right">${t.p?inr(t.p):'Free'}</div>
  <div class="qty"><button onclick="qty('${t.k}',-1,${t.cap})">−</button><span>${r.tix[t.k]||0}</span><button onclick="qty('${t.k}',1,${t.cap})">+</button></div></div>`).join('')}</div>
  <div class="alert info mt16">${ic('alert')}<span class="small">Passes are auto-suggested based on the participants you selected. Each participant receives their own QR pass.</span></div>`;
 }
 if(r.step===2){
  const ps=people().filter(p=>r.sel.includes(p.id));
  body=`<h2>Participant details</h2><p class="muted mt8 mb16">Details are auto-filled from your Osehub profile. Edit in Profile if anything is incorrect.</p>
  <div class="col">${ps.map(p=>`<div class="card pad"><div class="row between"><b>${p.name}</b>${pill(ic('check',11)+' Auto-filled','green')}</div><div class="grid g3 mt12">
   ${p.adult?`<div class="field"><label>Relation</label><input class="inp" value="Mother" disabled></div><div class="field"><label>Mobile</label><input class="inp" value="+91 98200 54321" disabled></div><div class="field"><label>Email</label><input class="inp" value="neha.sharma@example.com" disabled></div>`:
   `<div class="field"><label>Admission no.</label><input class="inp" value="${p.adm}" disabled></div><div class="field"><label>Date of birth</label><input class="inp" value="${p.dob}" disabled></div><div class="field"><label>Grade / Campus</label><input class="inp" value="Grade ${p.grade} · ${p.campus}" disabled></div>
   <div class="field"><label>T-shirt size</label><select class="inp"><option>S</option><option selected>M</option><option>L</option></select></div><div class="field"><label>Medical notes / allergies</label><input class="inp" placeholder="Optional"></div>`}
  </div></div>`).join('')}
  ${ps.some(p=>!p.adult)?`<div class="card pad"><b>Emergency contact (required for minors)</b><div class="grid g3 mt12"><div class="field"><label>Name</label><input class="inp" value="${r.em.name}" oninput="S.reg.em.name=this.value"></div><div class="field"><label>Relationship</label><input class="inp" value="${r.em.rel}" oninput="S.reg.em.rel=this.value"></div><div class="field"><label>Phone</label><input class="inp" value="${r.em.ph}" oninput="S.reg.em.ph=this.value"></div></div></div>`:''}
  </div>`;
 }
 if(r.step===3){
  const C=(k,t,d,part)=>`<label class="pcard ${r.cons[k]?'sel':''}"><input type="checkbox" class="" style="margin-top:3px;width:18px;height:18px;accent-color:var(--primary)" ${r.cons[k]?'checked':''} onchange="S.reg.cons.${k}=this.checked;render()"><div style="flex:1"><b>${t}</b>${part?P():''}${k!=='media'?' <span class="down">*</span>':''}<div class="small muted mt8">${d}</div><a class="small" onclick="event.preventDefault();modal('${t}','<p style=&quot;color:#475467&quot;>Full text of the ${t.toLowerCase()} appears here. Version 2026.3, last updated 01 Nov 2026.</p>')">Read full text</a></div></label>`;
  body=`<h2>Consents &amp; waivers</h2><p class="muted mt8 mb16">Your acceptance is recorded with date, time and version. You can review it any time in My Events.</p>
  <div class="col">${C('tc','Terms & conditions','I agree to the event terms, refund policy and registration rules.')}${C('waiver','Liability waiver','I understand the physical nature of the event and release the organisers from liability for incidental injuries.')}${C('coc','Code of conduct','My ward and I will follow the event code of conduct and staff instructions.')}${C('media','Media / photo consent (optional)','Allow photos/videos featuring my ward to be used in school publications. Required for gallery access after the event.',true)}</div>`;
 }
 if(r.step===4){
  const T=ticketTypes(e).filter(t=>r.tix[t.k]);
  body=`<h2>Review &amp; ${e.fee?'pay':'confirm'}</h2>
  <div class="card pad mt16"><div class="row between"><div><b>${e.title}</b><div class="small muted">${e.date} · ${e.venue}</div></div><a class="small" onclick="S.reg.step=0;render()">Edit</a></div>
  <div class="divider"></div><div class="small">${people().filter(p=>r.sel.includes(p.id)).map(p=>p.name).join(', ')}</div>
  ${T.map(t=>`<div class="sumline"><span>${r.tix[t.k]} × ${t.n}</span><span>${inr(t.p*r.tix[t.k])}</span></div>`).join('')}</div>
  ${S.role==='student'?`<div class="alert info mt16">${ic('users')}<div><b>Payment by parent</b>${P()}<div class="small">Your parent will receive a request to review and pay. Your registration stays as <i>Submitted (Pending Payment)</i> until then.</div></div></div>`:
  e.fee?`
  <div class="mt16"><label class="small b">Promo code${P()}</label><div class="row mt8"><input class="inp" id="promo" placeholder="EARLY10, REF100, SIB15" value="${r.promo}"><button class="btn btn-o" onclick="applyPromo()">Apply</button></div>
  ${r.promoOk?`<div class="small mt8" style="color:var(--green)">${ic('check',12)} ${r.promoOk} applied – you save ${inr(c.disc)}</div>`:r.promoOk===false?`<div class="small mt8 down">${ic('x',12)} Invalid or expired code</div>`:''}</div>
  ${e.instal?`<div class="mt16"><label class="small b">Payment plan${P()}</label><div class="seg mt8" style="display:flex"><button class="${r.plan==='full'?'on':''}" onclick="S.reg.plan='full';render()">Pay in full</button><button class="${r.plan==='part'?'on':''}" onclick="S.reg.plan='part';render()">Part-pay 40% now</button></div>${r.plan==='part'?`<p class="small muted mt8">Balance ${inr(c.total-c.now)} due by 15 Dec 2026. Reminder sent 3 days before.</p>`:''}</div>`:''}
  <div class="mt16"><label class="small b">Payment method</label><div class="paym mt8">${[['UPI','phone'],['Card','ticket'],['Net Banking','home']].map(([m,i])=>`<button class="${r.pay===m?'on':''}" onclick="S.reg.pay='${m}';render()">${ic(i,20)}${m}</button>`).join('')}</div>
  ${r.pay==='UPI'?`<div class="field mt12"><label>UPI ID</label><input class="inp" placeholder="name@bank"></div>`:r.pay==='Card'?`<div class="alert info mt12 small">${ic('lock')}You’ll enter card details on the secure payment gateway page.</div>`:`<div class="field mt12"><label>Bank</label><select class="inp"><option>HDFC Bank</option><option>ICICI Bank</option><option>State Bank of India</option><option>Axis Bank</option></select></div>`}</div>`:''}`;
 }
 const canNext=[r.sel.length>0&&!people().filter(p=>r.sel.includes(p.id)).some(p=>elig(e,p.adult?'self':p).length),Object.values(r.tix).reduce((a,b)=>a+b,0)>0,true,r.cons.tc&&r.cons.waiver&&r.cons.coc,true][r.step];
 const T=ticketTypes(e);
 const side=`<div class="card pad-l sticky"><h3>Order summary</h3><div class="small muted mt8">${e.title}</div><div class="small muted">${e.date}</div><div class="divider"></div>
 ${T.filter(t=>r.tix[t.k]).map(t=>`<div class="sumline small"><span>${r.tix[t.k]} × ${t.n}</span><span>${inr(t.p*r.tix[t.k])}</span></div>`).join('')||'<div class="small muted">No passes selected yet</div>'}
 ${c.disc?`<div class="sumline small" style="color:var(--green)"><span>Discount (${r.promoOk})</span><span>−${inr(c.disc)}</span></div>`:''}
 <div class="divider"></div><div class="sumline b"><span>Total</span><span>${inr(c.total)}</span></div>${r.plan==='part'?`<div class="sumline small"><span>Due now</span><span>${inr(c.now)}</span></div>`:''}
 <div class="mt16">${status}</div>
 <div class="divider"></div>
 ${r.step===4?(e.left===0?`<button class="btn btn-p w100 btn-lg" onclick="joinWait()">Join waitlist</button>`:S.role==='student'?`<button class="btn btn-p w100 btn-lg" onclick="studentSubmit()">Send to parent for payment</button>`:`<button class="btn btn-p w100 btn-lg" onclick="pay(true)">${c.total?`Pay ${inr(c.now)}`:'Confirm registration'}</button>${c.total?`<button class="btn btn-g w100 mt8 small" onclick="pay(false)">Simulate payment failure</button>`:''}`):
 `<button class="btn btn-p w100" ${canNext?'':'disabled'} onclick="nextStep()">Continue</button>`}
 <div class="row between mt12">${r.step>0?`<button class="btn btn-g" onclick="S.reg.step--;render()">${ic('back',14)}Back</button>`:'<span></span>'}<button class="btn btn-g" onclick="saveDraft()">${ic('file',14)}Save as draft${P()}</button></div>
 </div>`;
 return shell('Register · '+e.title,`<a class="small" onclick="go('#/event/${e.id}')">${ic('back',13)} ${e.title}</a><h1 class="mt8 mb16">Registration</h1>${steps}<div class="detail" style="margin-top:0"><div class="card pad-l">${body}</div><div>${side}</div></div>`);
}
function selP(id){const a=S.reg.sel;const i=a.indexOf(id);i>-1?a.splice(i,1):a.push(id);render()}
function uploadDoc(){modal('Upload medical fitness certificate',`<div class="card pad" style="border-style:dashed;text-align:center">${ic('upload',28)}<p class="mt8"><b>Drop file here</b> or click to browse</p><p class="small muted">PDF/JPG up to 5 MB · signed by a registered medical practitioner</p></div><div class="row mt12">${pill(ic('file',12)+' fitness_cert_aarav.pdf','blue')}<span class="small muted">Ready to upload</span></div>`,`<button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="S.docs.k1=true;closeModal();toast('Document uploaded · eligibility re-checked');render()">Upload</button>`)}
function qty(k,d,cap){const r=S.reg;const total=Object.values(r.tix).reduce((a,b)=>a+b,0);const v=(r.tix[k]||0)+d;if(v<0)return;if(d>0&&(v>cap||total>=4)){toast('Family cap reached (max 4 passes)','alert');return}r.tix[k]=v;render()}
function nextStep(){const r=S.reg,e=ev(r.ev);if(r.step===0&&!Object.keys(r.tix).length){const kids=r.sel.filter(x=>x!=='self').length,adults=r.sel.includes('self')?1:0;const T=ticketTypes(e);if(kids&&T.find(t=>t.k==='student'))r.tix.student=kids;if(adults){if(T.find(t=>t.k==='parent'))r.tix.parent=adults;else r.tix.student=(r.tix.student||0)+adults}}r.step++;render();scrollTo(0,0)}
function applyPromo(){const v=$('#promo').value.trim().toUpperCase();S.reg.promo=v;S.reg.promoOk=['EARLY10','REF100','SIB15'].includes(v)?v:false;render()}
function saveDraft(){toast('Saved as draft – resume from Discover or My Events','file');const r=S.reg;if(!S.drafts.find(d=>d.ev===r.ev))S.drafts.unshift({id:'D-'+(1050+S.drafts.length),ev:r.ev,who:people().filter(p=>r.sel.includes(p.id)).map(p=>p.name),step:REG_STEPS[r.step],saved:'just now',amt:calc().total})}
function pay(ok){const btns=document.querySelectorAll('.sticky .btn-p');btns.forEach(b=>{b.disabled=true;b.textContent='Processing…'});setTimeout(()=>{S.reg.result=ok?'ok':'fail';S.reg.txn='TXN'+(8823410000+Math.floor(Math.random()*99999));if(ok){const e=ev(S.reg.ev);S.myRegs.unshift({id:'R-'+(24900+S.myRegs.length),ev:e.id,who:people().filter(p=>S.reg.sel.includes(p.id)).map(p=>p.name),status:'Confirmed',tickets:Object.entries(S.reg.tix).filter(x=>x[1]).map(([k,v])=>v+' × '+ticketTypes(e).find(t=>t.k===k).n).join(', '),amt:calc().now,txn:S.reg.txn,seat:'Zone 3 · Gate B'});S.drafts=S.drafts.filter(d=>d.ev!==e.id)}else{saveDraftSilent()}render();scrollTo(0,0)},900)}
function saveDraftSilent(){const r=S.reg;if(!S.drafts.find(d=>d.ev===r.ev))S.drafts.unshift({id:'D-'+(1050+S.drafts.length),ev:r.ev,who:people().filter(p=>r.sel.includes(p.id)).map(p=>p.name),step:'Payment',saved:'just now',amt:calc().total})}
function joinWait(){const r=S.reg;S.waitlist.unshift({ev:r.ev,who:people().filter(p=>r.sel.includes(p.id)).map(p=>p.name).join(', '),pos:15,promo:false});toast('Added to waitlist · position #15','clock');S.reg=null;S.myTab='waitlist';go('#/my')}
function studentSubmit(){toast('Payment request sent to your parent','send');S.reg=null;go('#/my')}

 return shell('Reports & Audit',`<div class="page-head"><div><h1>Reports &amp; analytics</h1><p>Registrations, revenue, capacity, attendance and audit trail.</p></div><div class="row"><select class="inp" style="width:auto"><option>AY 2026-27</option><option>Last 30 days</option></select><button class="btn btn-o" onclick="toast('report.csv exported','download')">${ic('download')}Export CSV</button></div></div>
 <div class="tabs">${[['overview','Overview'],['audit','Audit trail']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="S.repTab='${k}';render()">${l}</button>`).join('')}</div>${b}`)}

function vSettings(){return shell('Settings',`<div class="page-head"><div><h1>Settings</h1><p>Taxonomy, templates and compliance.</p></div></div>
 <div class="grid g2"><div class="card pad-l"><h3>Categories</h3><div class="chips mt12">${OPTS.cat.map(c=>`<span class="chip">${c} ×</span>`).join('')}<button class="chip">+ Add</button></div><h3 class="mt16">Themes / disciplines</h3><div class="chips mt12">${OPTS.theme.map(c=>`<span class="chip">${c} ×</span>`).join('')}<button class="chip">+ Add</button></div><h3 class="mt16">Tags</h3><div class="chips mt12">${['inter-school','U12','U14','family','free','weekend'].map(c=>`<span class="chip">${c} ×</span>`).join('')}<button class="chip">+ Add</button></div></div>
 <div class="card pad-l"><h3>Event templates${P()}</h3>${['Open House','Webinar','Festival (multi-day)','Sports Competition'].map(t=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border)"><b>${t}</b><div class="row"><a class="small">Edit</a><a class="small">Use</a></div></div>`).join('')}</div>
 <div class="card pad-l"><h3>Data retention${P()}</h3><div class="grid g2 mt12"><div class="field"><label>Attendee lists</label><select class="inp"><option>3 years</option><option>5 years</option></select></div><div class="field"><label>Incident logs</label><select class="inp"><option>7 years</option></select></div><div class="field"><label>Consent records</label><select class="inp"><option>Until withdrawn + 3 yrs</option></select></div><div class="field"><label>Gallery media</label><select class="inp"><option>2 years</option></select></div></div></div>
 <div class="card pad-l"><h3>Consent &amp; policy templates</h3>${['Standard event T&C v2026.3','Sports waiver v2026.1','Photo/video consent v2026.1','Student code of conduct'].map(t=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border)"><span>${t}</span><a class="small">Edit</a></div>`).join('')}</div></div>`)}

/* ================= GUIDE ================= */
function vGuide(){const F=(steps)=>`<div class="flow">${steps.map(([l,h,r])=>`<a onclick="${r?`S.role='${r}';`:''}go('${h}')">${l}</a>`).join('<span class="arr">→</span>')}</div>`;
 const J=[
 ['Parent','Discover → eligibility → register → pay → pass → event day → post-event',[['Discover events','#/events','parent'],['Event detail','#/event/1','parent'],['Eligibility & participants','#/event/1','parent'],['Tickets → Details → Consents','#/event/1','parent'],['Pay (UPI/Card/NB)','#/event/1','parent'],['Confirmation & QR pass','#/my','parent'],['My Events / pre-event','#/my','parent'],['Refund / re-issue / reschedule','#/requests','parent']]],
 ['Student','Eligible-only discovery, self-registration, parent pays',[['Discover (Grade 6)','#/events','student'],['Register','#/event/3','student'],['Send to parent for payment','#/event/3','student'],['Passes & certificates','#/my','student']]],
 ['Coach / Teacher','Bulk register class roster with per-student validation',[['Dashboard','#/coach','coach'],['Bulk registration','#/bulk','coach'],['Invoice request','#/bulk','coach'],['Rosters & check-in status','#/rosters','coach']]],
 ['External School / Partner','Group registration, roster, group passes & certificates',[['Dashboard','#/coach','partner'],['Group registration','#/bulk','partner'],['Group roster & passes','#/rosters','partner']]],
 ['Speaker / Host','Profile and slot details',[['Profile','#/speaker','speaker'],['My slots & agenda','#/slots','speaker']]],
 ['Volunteer / Ops','Scan, look up, monitor, re-issue',[['QR check-in','#/checkin','volunteer'],['Roster lookup','#/lookup','volunteer'],['Live monitor','#/live','volunteer']]],
 ['Event / Program Admin','Set up → publish → communicate → run → wrap up → report',[['Dashboard','#/admin','admin'],['Create event (9 steps)','#/admin/create','admin'],['Manage events','#/admin/events','admin'],['Communications','#/admin/comms','admin'],['Live control','#/live','admin'],['Post-event','#/admin/post','admin'],['Exceptions','#/admin/exceptions','admin'],['Reports & audit','#/admin/reports','admin']]]
 ];
 return shell('Flow guide',`<div class="page-head"><div><h1>Prototype flow guide</h1><p>Every journey from the E&amp;E Scope Mapping. Click a step to jump in as that role. Turn on <b>Show scope tags</b> in the sidebar to see “Partially in scope” items.</p></div></div>
 <div class="col">${J.map(([r,d,s])=>`<div class="card pad-l"><div class="row between wrap"><h3>${r}</h3><span class="small muted">${d}</span></div><div class="mt12">${F(s)}</div></div>`).join('')}
 <div class="card pad-l"><h3>Try these scenarios</h3><ul class="small" style="color:#475467;margin:8px 0 0;padding-left:18px;line-height:1.9">
 <li><b>Parent → Athletics Meet:</b> Myra fails grade check, Aarav needs a medical certificate (upload to unblock), then pay with promo <code>EARLY10</code>.</li>
 <li><b>Parent → Payment failure:</b> on the pay step choose “Simulate payment failure” to see draft preserved + retry.</li>
 <li><b>Parent → Rang Festival:</b> multi-day agenda, workshop add-on, part-payment option.</li>
 <li><b>Parent → Junior Robotics Showcase:</b> full event → waitlist; My Events › Waitlist shows a seat-offer with timeout.</li>
 <li><b>Parent → My Events:</b> rescheduled beach clean-up (accept/decline), pass QR, refund request, certificates, consent-gated gallery.</li>
 <li><b>Volunteer → Check-in:</b> valid, duplicate and invalid scans.</li></ul></div></div>`)}

/* ================= ROUTER ================= */
function render(){
 const h=location.hash||'#/login';
 if(!S.role&&h!=='#/login'){location.hash='#/login';return}
 if(h==='#/login'){$('#root').innerHTML=vLogin();return}
 const [,a,b,c]=h.split('/');let out;
 switch(a){
  case 'events':out=vEvents();break;
  case 'event':out=vEvent(b);break;
  case 'register':out=vRegister();break;
  case 'my':out=vMy();break;
  case 'requests':out=vRequests();break;
  case 'notifications':out=vNotif();break;
  case 'coach':out=vCoachDash();break;
  case 'bulk':out=vBulk(b);break;
  case 'rosters':out=vRosters();break;
  case 'speaker':out=vSpeaker();break;
  case 'slots':out=vSlots();break;
  case 'checkin':out=vCheckin();break;
  case 'lookup':out=vLookup();break;
  case 'live':out=vLive();break;
  case 'guide':out=vGuide();break;
  case 'admin':out=!b?vAdmin():b==='events'?vAdminEvents():b==='create'?vCreate():b==='comms'?vComms():b==='post'?vPost():b==='exceptions'?vExceptions():b==='reports'?vReports():b==='settings'?vSettings():vAdmin();break;
  default:out=vEvents();
 }
 $('#root').innerHTML=out;
 document.body.classList.toggle('show-scope',S.scope);
}
window.addEventListener('hashchange',()=>{agendaDay=0;render();window.scrollTo(0,0)});
render();
</script>
