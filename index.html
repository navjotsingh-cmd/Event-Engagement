<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events & Engagements – OSE Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2F55E4; --primary-dark:#2344C4; --primary-50:#EDF1FF; --primary-100:#DCE4FF;
  --orange:#F2542D; --purple:#5B36E8; --navy:#26357A; --accent:#F2542D;
  --text:#1A1A1A; --muted:#6B7078; --field:#8A8F98; --border:#E8EAEE; --line:#D9DDE6; --soft:#F6F7F9;
  --bg:#fff; --surface:#fff;
  --green:#1F7A3A; --green-50:#E7F5EC; --red:#E5484D; --red-50:#FDECEC; --amber:#C2410C; --amber-50:#FFF1EA;
  --violet:#5B36E8; --violet-50:#F0ECFF; --pink:#D6336C; --pink-50:#FDEBF3;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.06);
  --display:"Anton",Impact,"Arial Narrow",sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:clamp(16px,5.6vw,88px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:#fff;color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none;cursor:pointer}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:500}
h1{font-size:30px;letter-spacing:-.01em} h2{font-size:19px} h3{font-size:16px} h4{font-size:13px;font-weight:600}
p{margin:0}
code{background:var(--soft);padding:1px 5px;border-radius:4px}
.svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border)}
.hdr-in{height:56px;display:flex;align-items:center;gap:28px;padding:0 var(--gut)}
.logo{display:inline-flex;align-items:flex-end;font-weight:700;font-size:34px;letter-spacing:-.04em;line-height:1;color:var(--primary);flex:none}
.logo i{font-style:normal;color:var(--orange)}
.logo small{font-size:9.5px;letter-spacing:.02em;color:var(--orange);margin-left:1px;margin-bottom:2px;font-weight:700}
.hsearch{flex:1;max-width:556px;display:flex;align-items:center;gap:10px;border:1px solid #C9CDD5;border-radius:10px;padding:0 14px;height:40px;color:var(--muted)}
.hsearch input{border:0;outline:none;flex:1;height:100%;background:transparent;color:var(--text)}
.hnav{display:flex;align-items:center;gap:22px;margin-left:auto;height:100%}
.hnav>a,.hnav>.dd>button{color:#4A4F57;font-weight:400;font-size:14.5px;height:56px;display:flex;align-items:center;gap:4px;border:0;background:none;border-bottom:2px solid transparent;padding:0;white-space:nowrap}
.hnav>a:hover,.hnav>.dd>button:hover{color:var(--text)}
.hnav>a.on,.hnav>.dd>button.on{color:var(--primary);border-bottom-color:var(--primary)}
.dd{position:relative;height:100%;display:flex;align-items:center}
.uchip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;background:#fff;font-weight:500}
.uchip .av{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.bellbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
.bellbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.menu{position:absolute;top:52px;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(20,30,60,.14);padding:6px;min-width:210px;z-index:50}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text)}
.menu a:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.mega{position:absolute;top:60px;left:50%;transform:translateX(-58%);width:min(1250px,94vw);max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 44px rgba(20,30,60,.16);padding:44px 62px;display:grid;grid-template-columns:1fr 1fr;gap:0 64px;z-index:50}
.mega .mg{padding:0 0 26px}
.mega .mg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;cursor:pointer}
.mega .mg-h h3{font-size:21px;font-weight:400;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.mega .mg-h p{color:#2B2F36;font-size:15.5px;margin-top:10px;line-height:1.55}
.mega .mg-h:hover h3,.mega .mg-h.on h3{color:var(--primary)}
.mega .mg-c{width:20px;height:20px;margin-top:28px;flex:none;transition:transform .15s}
.mega .mg-kids{margin-top:12px;border-left:2px solid var(--border);padding-left:10px;display:flex;flex-direction:column;gap:2px}
.mega a.mg-k{display:block;padding:9px 12px;border-radius:8px;color:var(--text)}
.mega a.mg-k:hover,.mega a.mg-k.on{background:var(--primary-50)}
.mega a.mg-k b{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14.5px}
.mega a.mg-k.on b{color:var(--primary)}
.mega a.mg-k span{display:block;color:var(--muted);font-size:12.5px}
.new{background:var(--orange);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.menu-btn{display:none;border:0;background:none;padding:6px}

/* ---------- Page / layout ---------- */
.wrap-c{padding:0 var(--gut)}
.page{padding-top:22px;padding-bottom:64px;min-height:70vh}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13.5px;margin-bottom:16px}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--text)} .crumbs b{color:var(--text);font-weight:500}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}
.sec-title{text-align:center;font-size:clamp(30px,3.6vw,46px);font-weight:500;letter-spacing:-.025em;margin:56px 0 28px}
.sec-sub{text-align:center;color:var(--muted);margin:-18px 0 28px;font-size:15px}

/* ---------- Back-office layout (admin / ops) ---------- */
.bo{display:grid;grid-template-columns:244px 1fr;min-height:calc(100vh - 57px)}
.bo-side{border-right:1px solid var(--border);padding:18px 12px;background:#fff;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.bo-side .sect{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--field);padding:10px 12px 6px;font-weight:600}
.bo-side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#3F444C;font-weight:500;margin-bottom:2px}
.bo-side a:hover{background:var(--soft)}
.bo-side a.on{background:var(--primary-50);color:var(--primary)}
.bo-side a .cnt{margin-left:auto;background:var(--orange);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
.bo-main{background:var(--soft);padding:24px 32px 64px;min-width:0}

/* ---------- Generic components ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
.pad{padding:16px} .pad-l{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:500;border:1px solid transparent;white-space:nowrap;font-size:14px}
.btn-p{background:var(--primary);color:#fff} .btn-p:hover{background:var(--primary-dark)}
.btn-o{background:#fff;color:var(--text);border-color:var(--line)} .btn-o:hover{background:var(--soft)}
.btn-g{background:transparent;color:var(--primary);padding:6px 8px}
.btn-d{background:var(--red);color:#fff}
.btn-s{background:var(--green);color:#fff}
.btn-w{background:#fff;color:var(--text);font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:13px;border-radius:999px;padding:9px 18px}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-lg{padding:12px 22px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.w100{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:#EEF0F4;color:#3B4048;white-space:nowrap}
.pill.blue{background:#E6ECFF;color:#3550C8} .pill.green{background:var(--green-50);color:var(--green)}
.pill.red{background:var(--red-50);color:#C0322B} .pill.amber{background:var(--amber-50);color:var(--amber)}
.pill.violet{background:var(--violet-50);color:var(--violet)} .pill.pink{background:var(--pink-50);color:var(--pink)}
.pill.dark{background:var(--navy);color:#fff} .pill.accent{background:#FFF1EA;color:#C2410C}
.scope{display:none;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:#FDE68A;color:#78350F;vertical-align:middle;margin-left:6px;line-height:1.5}
body.show-scope .scope{display:inline-block}
.row{display:flex;gap:12px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)} .small{font-size:12.5px} .b{font-weight:600}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.divider{height:1px;background:var(--divider);margin:16px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:#2B2F36}
.req{color:var(--red)}
.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%;min-height:42px}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.inp:disabled{background:var(--soft);color:#4A4F57}
textarea.inp{min-height:88px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--primary)}
.toggle{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#CDD2DB;border-radius:22px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--primary)} .toggle input:checked+span:before{transform:translateX(16px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(20,30,60,.12)}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--border);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.kpi{padding:16px 18px}
.kpi .v{font-size:26px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .d{font-size:12.5px;margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)}
.bar{height:7px;background:#EDEFF3;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:8px}
.bar.warn i{background:var(--orange)} .bar.full i{background:var(--red)} .bar.ok i{background:var(--green)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid}
.alert.info{background:var(--primary-50);border-color:var(--primary-100);color:#1E3A8A}
.alert.warn{background:var(--amber-50);border-color:#FBD3BF;color:#7C2D12}
.alert.err{background:var(--red-50);border-color:#F6C2C2;color:#7F1D1D}
.alert.ok{background:var(--green-50);border-color:#B9E6C9;color:#14532D}
.empty{padding:40px;text-align:center;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:#3B4048}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.searchbar{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;flex:1;min-width:220px}
.searchbar input{border:0;outline:none;padding:10px 0;width:100%;background:transparent}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.price{font-weight:600;font-size:21px;letter-spacing:-.01em}
.th-Sports{background:linear-gradient(135deg,#12A150,#0A6E37)} .th-Psychology{background:linear-gradient(135deg,#5B36E8,#7C5CFF)}
.th-Cultural{background:linear-gradient(135deg,#F2542D,#FF8A3D)} .th-STEM{background:linear-gradient(135deg,#1E2A78,#2F55E4)}
.th-Nutrition{background:linear-gradient(135deg,#2F7D32,#4CAF50)} .th-Wellness{background:linear-gradient(135deg,#0B7285,#22B8CF)}
.th-PerformingArts{background:linear-gradient(135deg,#C2185B,#EC407A)}

/* ---------- Poster + event card (OSE Hub style) ---------- */
.poster{position:relative;overflow:hidden;border-radius:14px 14px 0 0;aspect-ratio:323/280;color:#fff}
.poster .phead{position:absolute;left:16px;top:14px;font-family:var(--display);font-size:clamp(30px,3.1vw,46px);line-height:.98;text-transform:uppercase;letter-spacing:.005em;z-index:2;max-width:70%}
.poster .ptag{position:absolute;right:14px;top:14px;border-left:2px solid rgba(255,255,255,.9);padding-left:10px;font-weight:700;font-size:13px;z-index:2;line-height:1.2}
.poster .art{position:absolute;right:0;bottom:0;width:62%;height:62%;z-index:1}
.poster .pstatus{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;z-index:3}
.st-green{color:var(--green)} .st-orange{color:#C2410C} .st-grey{color:#5B6068} .st-amber{color:#B45309}
.poster.lg{border-radius:14px;aspect-ratio:924/460}
.poster.lg .phead{font-size:clamp(40px,6vw,86px);left:clamp(20px,3vw,44px);top:clamp(20px,4vw,44px);max-width:62%}
.poster.lg .ptag{font-size:14px;right:18px;top:18px}
.poster.sm{border-radius:10px;aspect-ratio:200/140}
.poster.sm .phead{font-size:18px;left:8px;top:8px}
.poster.sm .ptag,.poster.sm .pstatus{display:none}
.ecard{background:#fff;border:1px solid #C9CDD5;border-radius:14px;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,transform .15s}
.ecard:hover{box-shadow:0 10px 28px rgba(20,30,60,.12);transform:translateY(-2px)}
.ecard .eb{padding:12px 10px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.ecard h3{font-size:16px;font-weight:500;line-height:1.3}
.ttl-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ico-btns{display:flex;gap:14px;color:#2B2F36;padding-top:2px}
.ico-btns button{border:0;background:none;padding:0;display:grid}
.ico-btns .liked{color:var(--red)} .ico-btns .liked .svg{fill:var(--red)}
.meta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#4A4F57}
.meta div{display:flex;gap:10px;align-items:flex-start}
.meta .svg{margin-top:2px;color:#6B7078;width:16px;height:16px}
.ecard .pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:6px}
.ecard .pr small{font-size:12px;color:#3B4048}

/* ---------- Home ---------- */
.hero{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:22px var(--gut) 0;scroll-padding:0 var(--gut)}
.hero::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(1120px,86vw);aspect-ratio:1120/320;border-radius:16px;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff;padding:clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center}
.slide small{font-weight:700;letter-spacing:.06em;font-size:13px;opacity:.95}
.slide h2{font-family:var(--display);font-size:clamp(34px,5vw,64px);line-height:1;margin:8px 0 10px;text-transform:uppercase;max-width:60%}
.slide p{opacity:.95;max-width:46%;font-size:14.5px}
.slide .btn-w{margin-top:18px;align-self:flex-start}
.slide .art{position:absolute;right:4%;bottom:0;height:92%;width:34%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots button{width:8px;height:8px;border-radius:8px;border:0;background:#D0D4DC;padding:0}
.dots button.on{width:22px;background:var(--purple)}
.band{background:var(--purple);padding:40px 0 34px;margin-top:64px;color:#fff}
.band h2{text-align:center;font-size:clamp(26px,3vw,40px);font-weight:500;letter-spacing:-.02em;margin-bottom:24px}
.catrow{display:flex;gap:14px;overflow-x:auto;padding:0 var(--gut);scroll-snap-type:x mandatory;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catcard{flex:0 0 190px;min-height:190px;border-radius:12px;padding:16px;color:var(--text);display:flex;flex-direction:column;justify-content:flex-end;scroll-snap-align:start;cursor:pointer}
.catcard .n{font-size:12px;color:var(--muted);margin-bottom:auto;font-weight:600}
.catcard b{font-size:17px;font-weight:500;line-height:1.2;margin-bottom:6px}
.catcard p{font-size:12px;color:#4A4F57}
.catcard a{font-size:12.5px;font-weight:600;color:var(--purple);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,172px));gap:16px;justify-content:center}
.stat{border-radius:12px;padding:18px 16px}
.stat .v{font-size:26px;margin:6px 0 4px}
.stat .l{font-size:13px;font-weight:500;color:#2B2F36}
.foot{background:#0F1430;color:#C9CDE0;margin-top:72px;padding:44px var(--gut) 28px}
.foot .logo small,.foot .logo i{color:var(--orange)}
.foot .logo{color:#fff}
.foot a{color:#C9CDE0}
.foot h4{color:#fff;margin-bottom:10px;font-size:14px}
.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}
.foot .cols div a{display:block;padding:3px 0;font-size:13.5px}

/* ---------- Listing ---------- */
.lbar{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.fbtn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:0;border-radius:10px;padding:0 20px;height:44px;font-weight:500;font-size:15px;flex:none}
.fbtn .n{background:#fff;color:var(--primary);border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.catchips{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
.catchips::-webkit-scrollbar{display:none}
.catchips button{display:inline-flex;align-items:center;gap:9px;border:1px solid #2B2F36;background:#fff;border-radius:10px;height:44px;padding:0 20px;font-size:15px;white-space:nowrap;flex:none}
.catchips button.on{background:var(--primary-50);border-color:var(--primary);color:var(--primary)}
.chev{border:0;background:none;color:var(--primary);padding:6px;flex:none}

/* ---------- Detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:36px;align-items:start}
.sticky{position:sticky;top:76px}
.side-card{background:#FAFAFB;border:1px solid var(--border);border-radius:14px;padding:22px}
.side-card h2{font-size:21px;line-height:1.35;font-weight:500}
.side-card .meta{gap:14px;font-size:14px;color:#2B2F36}
.side-card .meta .svg{width:18px;height:18px;color:#2B2F36}
.sec{padding:22px 0;border-top:1px solid var(--divider)}
.sec h2{font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec ul{margin:8px 0 0;padding-left:20px;color:#4A4F57;line-height:1.9}
.sec p{color:#4A4F57}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.agenda-item{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.agenda-item:last-child{border:0}
.mapbox{height:170px;border-radius:12px;background:repeating-linear-gradient(45deg,#EDF1FA,#EDF1FA 10px,#F5F7FC 10px,#F5F7FC 20px);display:grid;place-items:center;color:var(--muted);position:relative}
.mapbox .pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--orange)}
.faq{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff}
.faq summary{padding:13px 16px;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"+";color:var(--muted)} .faq[open] summary::after{content:"–"}
.faq p{padding:0 16px 13px;color:#4A4F57}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:6px}
.vcard.on{border-color:var(--primary);background:#F3F6FF;box-shadow:0 0 0 1px var(--primary)}
.vcard.off{opacity:.5;cursor:not-allowed}
.vcard .top{display:flex;align-items:center;gap:8px}
.vcard .top input{width:16px;height:16px;accent-color:var(--primary);margin:0}
.vcard .top b{font-weight:600}
.vcard .sub{color:var(--muted);font-size:12.5px;padding-left:24px}
.vcard .bot{display:flex;justify-content:space-between;border-top:1px solid var(--divider);padding-top:8px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.vcard .bot b{color:var(--text);font-size:14px}
.dashed{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.selline{display:flex;justify-content:space-between;font-size:13px;color:#4A4F57;padding:3px 0}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:12px;background:#FAFAFB;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;color:#2B2F36;min-height:52px}
.tile .ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#EEEBFF;color:var(--purple);flex:none}
.tile .ti.grn{background:var(--green-50);color:var(--green);border-radius:50%}
.tile .ti.red{background:var(--red-50);color:var(--red);border-radius:50%}
.prow{display:flex;align-items:center;gap:16px;border:1px solid var(--border);border-radius:12px;padding:14px 18px;cursor:pointer;background:#fff;transition:.15s}
.spk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.spk{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff}
.spk .avatar{width:48px;height:48px;font-size:16px;background:var(--violet-50);color:var(--violet);flex:none}
.spk b{font-weight:500;font-size:15px}
.prow:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.prow .pi{width:42px;height:42px;border-radius:10px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;flex:none}
.prow b{font-weight:500;font-size:15px}
.prow .pv{font-weight:500;color:var(--text);padding:0 8px}
details.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary h2{margin:0}
details.acc>summary .svg{transform:rotate(90deg);transition:.15s;color:var(--muted)}
details.acc[open]>summary .svg{transform:rotate(-90deg)}
details.acc h3{font-size:14px;font-weight:600}
details.acc ul{margin-top:6px}
@media(max-width:780px){.tiles{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.tiles{grid-template-columns:1fr}}
/* ---------- Registration ---------- */
.evsum{border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:22px}
.evsum .in{display:grid;grid-template-columns:200px 1fr 1fr;gap:18px;margin-top:14px;align-items:start}
.evsum .meta{gap:10px}
.stepper{display:flex;align-items:center;gap:0;margin:6px 0 24px;overflow-x:auto}
.step{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font-size:13px;flex:none;background:#fff}
.step small{display:block;font-size:10.5px;color:var(--field);letter-spacing:.05em;text-transform:uppercase}
.step span{font-size:13.5px;color:var(--muted)}
.step.on .n{background:var(--primary);border-color:var(--primary);color:#fff}
.step.on span{color:var(--text);font-weight:500}
.step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step.done span{color:var(--text)}
.step:not(:last-child)::after{content:"";flex:1;height:1px;background:var(--line);margin:0 14px;min-width:20px}
.regwrap{max-width:1120px;margin:0 auto;padding:22px 24px}
.ppgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,268px));gap:12px}
.ppc{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px 12px 10px;cursor:pointer;background:#fff;transition:.15s;position:relative}
.ppc:hover{border-color:var(--primary)}
.ppc.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-50)}
.ppc .cb{width:18px;height:18px;border:1.5px solid #B9BFD0;border-radius:4px;flex:none;margin-top:2px;display:grid;place-items:center;color:#fff}
.ppc.on .cb{background:var(--primary);border-color:var(--primary)}
.ppc .avatar{width:38px;height:38px;font-size:13px;flex:none}
.ppc b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppc-sch{border-top:1px solid var(--divider);margin-top:6px;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ppc.off{background:#F6F7F9;opacity:.75;cursor:help}.ppc.off b,.ppc.off .ppc-sch{color:var(--muted)}
.pbadge{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}.pbadge.red{background:#FDE7E7;color:#C62828}.pbadge.blue{background:var(--primary-50);color:var(--primary)}.pbadge.amber{background:#FFF1DB;color:#B26A00}.pbadge.green{background:#E3F6EA;color:#1B7F3B}
.regev{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.regev-p{width:217px;height:145px;border-radius:10px;overflow:hidden;flex:none}.regev-p>*{height:100%}
.pblk{border:1px solid var(--border);border-radius:12px;background:#fff}.pblk-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--divider)}.pblk-h .avatar{width:40px;height:40px}.pblk-b{padding:16px 18px}
@media(max-width:700px){.regev-p{width:100%;height:160px}.regwrap{padding:16px}}
.regbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(20,30,60,.06);z-index:30}
.regbar .in{display:flex;align-items:center;justify-content:flex-end;gap:18px;height:64px;padding:0 var(--gut)}
.regbar .tot{text-align:right;line-height:1.1}
.regbar .tot b{font-size:22px;font-weight:500}
.regbar .tot small{display:block;color:var(--muted);font-size:11.5px}
.vvsteps{display:flex;flex-direction:column;gap:2px}
.vsteps{display:flex;flex-direction:column;gap:2px}
.vsteps button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:500;color:var(--muted)}
.vsteps button.on{background:var(--primary-50);color:var(--primary)}
.vsteps button .n{width:22px;height:22px;border-radius:50%;background:#E9EDF4;display:grid;place-items:center;font-size:11px;flex:none}
.vsteps button.on .n{background:var(--primary);color:#fff}
.vsteps button.done .n{background:var(--green);color:#fff}
.status-track{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-track .s{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.status-track .s i{width:10px;height:10px;border-radius:50%;background:#D0D5DD}
.status-track .s.on{color:var(--text)} .status-track .s.on i{background:var(--green)}
.status-track .s.cur i{background:var(--orange);box-shadow:0 0 0 4px #FDE3D9}
.status-track .ln{width:24px;height:2px;background:#D0D5DD}
.pcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:#fff}
.pcard.sel{border-color:var(--primary);background:#F7F9FF;box-shadow:0 0 0 1px var(--primary)}
.pcard.bad{background:#FFFBFB}
.issue{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-top:6px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{border:0;background:var(--soft);width:32px;height:32px;font-size:16px}
.qty span{width:36px;text-align:center;font-weight:600}
.paym{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paym button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px}
.paym button.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.sumline{display:flex;justify-content:space-between;padding:6px 0}
.formsec{font-size:15px;font-weight:600;margin:4px 0 12px}
.pass{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#fff;max-width:360px;width:100%}
.pass-top{background:var(--primary);color:#fff;padding:16px 18px}
.pass-mid{padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;border-bottom:2px dashed var(--border)}
.pass-bot{padding:14px 18px;font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pass-bot b{display:block;font-size:13px;font-weight:600}

/* ---------- Modal / toast / dock ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,40,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-h h2{font-size:19px;font-weight:600}
.modal-b{padding:22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.iconbtn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
.toasts{position:fixed;bottom:84px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#15171C;color:#fff;padding:11px 16px;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.dock{position:fixed;left:16px;bottom:16px;z-index:60;background:#15171C;color:#fff;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dock select{background:#2A2E38;color:#fff;border:0;border-radius:7px;padding:4px 6px;font-size:12.5px}
.dock a{color:#9DB3FF}
.dock label{display:flex;align-items:center;gap:6px;cursor:pointer}
.dock .toggle{transform:scale(.8)}
.dock.min .opt{display:none}

/* ---------- Ops ---------- */
.scanner{aspect-ratio:1;max-width:340px;border-radius:18px;background:#0B1220;position:relative;overflow:hidden;margin:0 auto;display:grid;place-items:center}
.scanner .frame{width:62%;aspect-ratio:1;border:3px solid rgba(255,255,255,.85);border-radius:14px;position:relative}
.scanner .laser{position:absolute;left:8%;right:8%;height:2px;background:#22C55E;box-shadow:0 0 12px #22C55E;animation:scan 2s infinite ease-in-out}
@keyframes scan{0%,100%{top:10%}50%{top:88%}}
.feed div{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;background:var(--primary);border-radius:6px 6px 0 0}
.bars .b span{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bars .b em{font-style:normal;font-size:11px;font-weight:600}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow a{background:var(--primary-50);color:var(--primary);padding:6px 10px;border-radius:8px;font-weight:500;font-size:12.5px}
.flow .arr{color:var(--muted)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-l{position:relative;overflow:hidden;background:linear-gradient(135deg,#F2542D,#FF8A3D);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-l h1{font-family:var(--display);font-size:clamp(44px,5vw,72px);line-height:1;text-transform:uppercase;font-weight:400}
.login-r{display:grid;place-items:center;padding:32px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolegrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left;font-weight:500;font-size:13px}
.rolegrid button.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.rolegrid small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}

@media (max-width:1100px){.detail{grid-template-columns:1fr}.sticky{position:static}.g4{grid-template-columns:repeat(2,1fr)}.evsum .in{grid-template-columns:140px 1fr}.evsum .in>:last-child{grid-column:2}}
@media (max-width:980px){
  .hsearch{display:none}
  .hnav>a,.hnav>.dd.hide-sm{display:none}
  .bo{grid-template-columns:1fr}
  .bo-side{position:fixed;left:0;top:57px;bottom:0;width:260px;height:auto;z-index:45;transform:translateX(-100%);transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .bo-side.open{transform:none}
  .menu-btn{display:grid}
  .g3,.g2{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}.login-l{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .foot .cols{grid-template-columns:1fr 1fr}
  .slide p{max-width:70%}
  .mega{grid-template-columns:1fr;transform:translateX(-50%);left:50%;position:fixed;top:60px;padding:24px}
}
@media (max-width:600px){
  .hdr-in{gap:12px}
  .uchip .nm{display:none}
  .bo-main{padding:16px}
  .g4{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
  .paym{grid-template-columns:1fr}
  .agenda-item{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 44px}
  .slide{aspect-ratio:auto;min-height:260px}
  .slide h2,.slide p{max-width:100%}
  .slide .art{opacity:.25}
  .evsum .in{grid-template-columns:1fr}.evsum .in>:last-child{grid-column:auto}
  .regbar .in{justify-content:space-between}
  .dock .opt{display:none}
}

</style>

function elig(e,who){ // who: kid obj or 'self'

   else if(e.grades&&(who.grade<e.grades[0]||who.grade>e.grades[1]))issues.push({t:'grade',m:`Grade ${who.grade} not eligible (Grades ${e.grades[0]}–${e.grades[1]})`});

 }
 return issues;
}

function vReports(){const t=S.repTab;let b='';

 if(t==='audit')b=`<div class="card tbl-wrap"><table class="t"><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr>${[['25 Nov, 10:42','Program Office','Published','Event #3','Rang – Annual Cultural Festival'],['25 Nov, 10:15','Program Office','Approved refund','RF-311','₹1,500 to original method'],['24 Nov, 18:02','Imran Shaikh','Re-issued pass','RI-104','ID validated · old QR revoked'],['24 Nov, 16:40','System','Waitlist promotion','Event #4','Seat offered to Aarav Sharma · 24h timeout'],['24 Nov, 09:00','System','Reminder sent','Event #2','T–7 · 188 recipients'],['23 Nov, 14:21','Program Office','Edited eligibility','Event #1','Grades 4–10 (was 5–10)']].map(r=>`<tr><td class="small">${r[0]}</td><td>${r[1]}</td><td><b>${r[2]}</b></td><td>${r[3]}</td><td class="small muted">${r[4]}</td></tr>`).join('')}</table></div>`;
 return shell('Reports & Audit',`<div class="page-head"><div><h1>Reports &amp; analytics</h1><p>Registrations, revenue, capacity, attendance and audit trail.</p></div><div class="row"><select class="inp" style="width:auto"><option>AY 2026-27</option><option>Last 30 days</option></select><button class="btn btn-o" onclick="toast('report.csv exported','download')">${ic('download')}Export CSV</button></div></div>
 <div class="tabs">${[['overview','Overview'],['audit','Audit trail']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="S.repTab='${k}';render()">${l}</button>`).join('')}</div>${b}`)}

 <div class="grid g2"><div class="card pad-l"><h3>Categories</h3><div class="chips mt12">${OPTS.cat.map(c=>`<span class="chip">${c} ×</span>`).join('')}<button class="chip">+ Add</button></div><h3 class="mt16">Themes / disciplines</h3><div class="chips mt12">${OPTS.theme.map(c=>`<span class="chip">${c} ×</span>`).join('')}<button class="chip">+ Add</button></div><h3 class="mt16">Tags</h3><div class="chips mt12">${['inter-school','U12','U14','family','free','weekend'].map(c=>`<span class="chip">${c} ×</span>`).join('')}<button class="chip">+ Add</button></div></div>
 <div class="card pad-l"><h3>Event templates${P()}</h3>${['Open House','Webinar','Festival (multi-day)','Sports Competition'].map(t=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border)"><b>${t}</b><div class="row"><a class="small">Edit</a><a class="small">Use</a></div></div>`).join('')}</div>
 <div class="card pad-l"><h3>Data retention${P()}</h3><div class="grid g2 mt12"><div class="field"><label>Attendee lists</label><select class="inp"><option>3 years</option><option>5 years</option></select></div><div class="field"><label>Incident logs</label><select class="inp"><option>7 years</option></select></div><div class="field"><label>Consent records</label><select class="inp"><option>Until withdrawn + 3 yrs</option></select></div><div class="field"><label>Gallery media</label><select class="inp"><option>2 years</option></select></div></div></div>
 <div class="card pad-l"><h3>Consent &amp; policy templates</h3>${['Standard event T&C v2026.3','Sports waiver v2026.1','Photo/video consent v2026.1','Student code of conduct'].map(t=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border)"><span>${t}</span><a class="small">Edit</a></div>`).join('')}</div></div>`)}

/* ================= GUIDE ================= */
function vGuide(){const F=(steps)=>`<div class="flow">${steps.map(([l,h,r])=>`<a onclick="${r?`S.role='${r}';`:''}go('${h}')">${l}</a>`).join('<span class="arr">→</span>')}</div>`;
 const J=[
 ['Parent','Discover → eligibility → register → pay → pass → event day → post-event',[['Discover events','#/events','parent'],['Event detail','#/event/1','parent'],['Eligibility & participants','#/event/1','parent'],['Tickets → Details → Consents','#/event/1','parent'],['Pay (UPI/Card/NB)','#/event/1','parent'],['Confirmation & QR pass','#/my','parent'],['My Events / pre-event','#/my','parent'],['Refund / re-issue / reschedule','#/requests','parent']]],
 ['Student','Eligible-only discovery, self-registration, parent pays',[['Discover (Grade 6)','#/events','student'],['Register','#/event/3','student'],['Send to parent for payment','#/event/3','student'],['Passes & certificates','#/my','student']]],
 ['Coach / Teacher','Bulk register class roster with per-student validation',[['Dashboard','#/coach','coach'],['Bulk registration','#/bulk','coach'],['Invoice request','#/bulk','coach'],['Rosters & check-in status','#/rosters','coach']]],
 ['External School / Partner','Group registration, roster, group passes & certificates',[['Dashboard','#/coach','partner'],['Group registration','#/bulk','partner'],['Group roster & passes','#/rosters','partner']]],
 ['Speaker / Host','Profile and slot details',[['Profile','#/speaker','speaker'],['My slots & agenda','#/slots','speaker']]],
 ['Volunteer / Ops','Scan, look up, monitor, re-issue',[['QR check-in','#/checkin','volunteer'],['Roster lookup','#/lookup','volunteer'],['Live monitor','#/live','volunteer']]],
 ['Event / Program Admin','Set up → publish → communicate → run → wrap up → report',[['Dashboard','#/admin','admin'],['Create event (9 steps)','#/admin/create','admin'],['Manage events','#/admin/events','admin'],['Communications','#/admin/comms','admin'],['Live control','#/live','admin'],['Post-event','#/admin/post','admin'],['Exceptions','#/admin/exceptions','admin'],['Reports & audit','#/admin/reports','admin']]]
 ];
 return shell('Flow guide',`<div class="page-head"><div><h1>Prototype flow guide</h1><p>Every journey from the E&amp;E Scope Mapping. Click a step to jump in as that role. Turn on <b>Show scope tags</b> in the sidebar to see “Partially in scope” items.</p></div></div>
 <div class="col">${J.map(([r,d,s])=>`<div class="card pad-l"><div class="row between wrap"><h3>${r}</h3><span class="small muted">${d}</span></div><div class="mt12">${F(s)}</div></div>`).join('')}
 <div class="card pad-l"><h3>Try these scenarios</h3><ul class="small" style="color:#475467;margin:8px 0 0;padding-left:18px;line-height:1.9">
 <li><b>Parent → Athletics Meet:</b> Myra fails grade check, Aarav needs a medical certificate (upload to unblock), then pay with promo <code>EARLY10</code>.</li>
 <li><b>Parent → Payment failure:</b> on the pay step choose “Simulate payment failure” to see draft preserved + retry.</li>
 <li><b>Parent → Rang Festival:</b> multi-day agenda, workshop add-on, part-payment option.</li>
 <li><b>Parent → Junior Robotics Showcase:</b> full event → waitlist; My Events › Waitlist shows a seat-offer with timeout.</li>
 <li><b>Parent → My Events:</b> rescheduled beach clean-up (accept/decline), pass QR, refund request, certificates, consent-gated gallery.</li>
 <li><b>Volunteer → Check-in:</b> valid, duplicate and invalid scans.</li></ul></div></div>`)}

/* ================= ROUTER ================= */
function render(){
 const h=location.hash||'#/home';
 if(h==='#/login'||!location.hash){location.replace('#/home');return}
 if(S.role==='guest'&&PROTECTED(h)){location.replace('#/home');setTimeout(()=>openLogin(null,'Log in to continue.'),50);return}
 const [,a,b,c]=h.split('/');let out;
 switch(a){
  case 'home':out=vHome();break;
  case 'profile':out=vProfile();break;
  case 'events':out=vEvents();break;
  case 'event':out=vEvent(b);break;
  case 'register':out=vRegister();break;
  case 'my':out=vMy();break;
  case 'requests':out=vRequests();break;
  case 'notifications':out=vNotif();break;
  case 'coach':out=vCoachDash();break;
  case 'bulk':out=vBulk(b);break;
  case 'rosters':out=vRosters();break;
  case 'speaker':out=vSpeaker();break;
  case 'slots':out=vSlots();break;
  case 'checkin':out=vCheckin();break;
  case 'lookup':out=vLookup();break;
  case 'live':out=vLive();break;
  case 'guide':out=vGuide();break;
  case 'admin':out=!b?vAdmin():b==='events'?vAdminEvents():b==='create'?vCreate():b==='comms'?vComms():b==='post'?vPost():b==='exceptions'?vExceptions():b==='reports'?vReports():b==='settings'?vSettings():vAdmin();break;
  default:out=vHome();
 }
 $('#root').innerHTML=out;
 document.body.classList.toggle('show-scope',S.scope);
}
window.addEventListener('hashchange',()=>{agendaDay=0;S.mega=S.um=false;render();window.scrollTo(0,0)});
render();
</script>
